packages:
  # `@uxfront/testlane` is the published package and it sits at the workspace root.
  # Without this entry Changesets cannot see it and rejects every changeset with
  # "package @uxfront/testlane which is not in the workspace".
  - "."
  - apps/*

allowBuilds:
  # Only an auto-installed peer of @nuxt/content: Docus reads content with the
  # built-in node:sqlite, so the native binding is never built.
  better-sqlite3: false
  esbuild: true
  sharp: true
  # Its postinstall only switches the build to Vue 2; the default build is Vue 3's.
  vue-demi: false

# pnpm 11, which every install here runs (the `packageManager` field in
# package.json), rejects a version published less than 24 hours ago. List the
# exact fresh version here, and drop the entry once it is older than a day.
minimumReleaseAgeExclude:
  - "@uxfront/layer-docs@0.9.1"
  - "@uxfront/oxfmt-config@0.2.0"
  - "@uxfront/oxlint-config@0.2.0"
  - "@uxfront/typescript-config@0.2.0"

catalog:
  "@types/node": ^22.19.0
  # app/pages/[[lang]]/[...slug].vue, a copy of Docus's, keys its data with it.
  scule: ^1.3.0
  vitest: ^4.1.8

catalogs:
  # The docs site's stack: Docus and Nuxt at the versions the uxfront kit is
  # built and tested on (@uxfront/layer-ui and layer-docs need nuxt ^4.5).
  nuxt:
    "@nuxt/content": 3.17.0
    "@nuxt/kit": 4.7.0
    docus: 5.15.0
    nuxt: 4.7.0
    typescript: ^6.0.3
    vue: 3.5.46
    vue-router: 5.5.1
    vue-tsc: ^3.3.5
  # The uxfront homepage and docs kit.
  uxfront:
    "@uxfront/layer-docs": ^0.9.1
    "@uxfront/layer-ui": ^0.1.10
    "@uxfront/scene": ^0.5.0
    # Exact: the SEO check's rules and the Lighthouse thresholds change only on purpose.
    "@uxfront/site-checks": 0.1.0
    "@uxfront/ui": ^0.9.0
