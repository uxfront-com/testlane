# Audits the docs site nightly with the shared Lighthouse workflow, which skips
# a scheduled run when main hasn't moved since the last audit. Run it by hand
# from the Actions tab at any time: a manual run always audits.
name: Lighthouse

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:
  # Tests the caller itself, and each later pin bump, before it merges.
  pull_request:
    paths: [.github/workflows/lighthouse.yml]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lighthouse:
    name: Lighthouse
    permissions:
      actions: read # the change check reads earlier runs
      contents: read
    uses: uxfront-com/.github/.github/workflows/lighthouse.yml@d2f86bc4b9602818601b0415509c5be0348bb8bc # main
    with:
      # apps/docs only, as CI's `docs build` job installs it.
      install: pnpm install --frozen-lockfile --filter @uxfront/docs
      # The production build that Workers Builds deploys to testlane.dev, with
      # the server build's .output cleared first, as in CI's `docs build` job.
      # NODE_OPTIONS mirrors apps/docs/Dockerfile: the prerenderer needs more
      # heap than node's default.
      build: rm -rf apps/docs/.output && WORKERS_CI=1 NODE_OPTIONS=--max-old-space-size=4096 NUXT_TELEMETRY_DISABLED=1 pnpm --filter @uxfront/docs run generate
      # Six pages of the static build, served by `wrangler dev` the way
      # Cloudflare serves them (apps/docs/lighthouserc.json). Accessibility and
      # best practices below 0.95, or SEO below 1, fail the run. Performance
      # only warns, since it varies with the runner.
      audit: pnpm --filter @uxfront/docs lighthouse
      reports: apps/docs/.lighthouseci
