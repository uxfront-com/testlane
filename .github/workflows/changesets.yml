# The npm trusted publisher for @uxfront/testlane names this file by its exact
# filename. Renaming or moving changesets.yml revokes the publish credential,
# and the release then fails with a misleading E404.
#
# The release itself runs in the shared workflow in uxfront-com/.github, pinned
# by commit SHA. It opens or updates the "Version Packages" PR while changesets
# are pending, and publishes to npm when that PR merges.
name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release mid-flight.
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A called workflow can only lower these. npm needs `id-token: write` here
    # too, and the shared workflow passes it on only to its publish job.
    permissions:
      contents: write # version commit, git tags, GitHub releases
      pull-requests: write # the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    uses: uxfront-com/.github/.github/workflows/release.yml@18a1d7cb1576c8053a80f3d166cfefecd470f5b3 # main
    with:
      # Runs in the shared workflow's pack job, before anything reaches npm.
      # guard:packaging asserts that every promised verb survives the build.
      build: pnpm run typecheck && pnpm test && pnpm run build && pnpm run guard:packaging
