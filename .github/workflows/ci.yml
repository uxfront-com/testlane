name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every change to the published package needs a changeset, so nothing reaches
  # npm without a version bump and a changelog line. `pnpm changeset --empty`
  # covers a change that ships but has no consumer-visible effect.
  #
  # The paths below are the `files` field of package.json plus the sources that
  # produce it. The `changeset-release/main` branch is exempt: that PR consumes
  # changesets, so by definition it carries none.
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the diff below needs the merge base.
          fetch-depth: 0

      - name: Require a changeset for changes to the published package
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "$changed"
          if ! printf '%s\n' "$changed" | grep -qE '^(src/|bin/|package\.json$|tsconfig\.build\.json$|README\.md$|DESIGN\.md$)'; then
            echo "No change to the published package. No changeset needed."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^\.changeset/.+\.md$'; then
            echo "Changeset present."
            exit 0
          fi
          echo "::error::This PR changes the published package but adds no changeset. Run 'pnpm changeset', or 'pnpm changeset --empty' if nothing consumer-visible changed."
          exit 1

  # Two legs: the floor that `engines.node` in package.json promises, and the
  # line the repository runs on, read from .node-version. setup-node ignores
  # whichever of the two inputs a leg leaves empty.
  test:
    name: node ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 22 (floor)
            node-version: '22'
          - name: current (.node-version)
            node-version-file: .node-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node ${{ matrix.name }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: pnpm

      # The CLI only, as the `docs build` job installs apps/docs only.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @uxfront/testlane

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  # oxlint with the shared uxfront config (oxlint.config.ts), over the whole
  # repository, apps/docs included. Errors fail the job, and warnings are only
  # reported. `--format=github` turns each finding into an annotation on the PR.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # oxlint needs only the root's dev dependencies, even for apps/docs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @uxfront/testlane

      - name: Lint
        run: pnpm run lint --format=github

  # The `test` job above runs the root scripts only, never apps/docs' build or
  # tests. A consumer upgrade of `@uxfront/layer-docs` could break the CSS entry
  # point or add mandatory peer dependencies and still collect a full set of
  # green ticks (UXF-281).
  #
  # The job ALWAYS runs and filters inside itself, rather than filtering the
  # workflow with `on.pull_request.paths`. A workflow skipped by a path filter
  # never reports its checks, so as a required check it would leave every
  # unrelated pull request pending forever. Here the check always reports, and
  # pull requests that do not touch the docs pay only the checkout.
  docs:
    name: docs build
    runs-on: ubuntu-latest
    # Pull requests only. The change filter below needs a base branch to diff
    # against, which a push event does not carry.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the change filter below needs the merge base.
          fetch-depth: 0

      - name: Detect changes affecting apps/docs
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "$changed"
          # pnpm-workspace.yaml carries the version catalog, so a dependency bump
          # can change what apps/docs builds without touching apps/docs itself.
          # ci.yml is listed so changes to this gate test themselves.
          if printf '%s\n' "$changed" | grep -qE '^(apps/docs/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No apps/docs changes — skipping the docs build."
          fi

      - name: Set up pnpm
        if: steps.filter.outputs.changed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # .node-version names the Node line the docs image ships on (the
      # `node:<line>-slim` images in apps/docs/Dockerfile), so keep the two in step.
      - name: Set up Node
        if: steps.filter.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # `--frozen-lockfile` is half the gate: it fails when a dependency bump in
      # apps/docs/package.json never made it into pnpm-lock.yaml.
      - name: Install dependencies
        if: steps.filter.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile --filter @uxfront/docs

      - name: Test
        if: steps.filter.outputs.changed == 'true'
        run: pnpm --filter @uxfront/docs run test

      # NODE_OPTIONS mirrors apps/docs/Dockerfile: the prerenderer needs more
      # heap than node's default.
      - name: Build
        if: steps.filter.outputs.changed == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @uxfront/docs run build

      # The production build: what Workers Builds deploys to testlane.dev, and
      # what Lighthouse audits below, since the server build above is noindex.
      # The server build's .output goes first: Nitro's prerenderer serves files
      # it finds in .output/public, so `/` would come out as the server build's
      # page, noindex and pointing at its own chunks.
      - name: Build the static site
        if: steps.filter.outputs.changed == 'true'
        env:
          WORKERS_CI: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          rm -rf apps/docs/.output
          pnpm --filter @uxfront/docs run generate

      # The tags, sitemap, robots.txt, llms.txt, Markdown copies, structured
      # data and redirects of every page in the static build (apps/docs/README.md,
      # "Search and AI search"). It reads dist/ only, so it runs before
      # Lighthouse and fails fast, naming the page and the rule.
      - name: Check SEO
        if: steps.filter.outputs.changed == 'true'
        run: pnpm --filter @uxfront/docs check:seo

      # Six pages of the static build, served by `wrangler dev` the way
      # Cloudflare serves them (apps/docs/lighthouserc.json). Accessibility and
      # best practices below 0.95, or SEO below 1, fail the job. Performance only
      # warns, since it varies with the runner.
      - name: Lighthouse
        if: steps.filter.outputs.changed == 'true'
        run: pnpm --filter @uxfront/docs lighthouse

      # `nuxt typecheck` is deliberately NOT in this gate. On 5925b6e it reports
      # 3 errors, all 3 inside node_modules/@uxfront/layer-docs and none in
      # apps/docs — so it is red today and cannot be fixed from this repository.
      # A check that is red on arrival teaches reviewers to ignore red, which is
      # the failure this gate exists to remove. Add it here once
      # `pnpm --filter @uxfront/docs run typecheck` exits 0 on main.
